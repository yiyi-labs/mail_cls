<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:#fff;border:1px solid #dfe3ee;border-radius:15px;color:#20283f;font:12px/1.5 'Microsoft YaHei',sans-serif;min-height:462px}h2{font-size:17px;margin:0}p{color:#758097;margin:6px 0}.heading,.controls,.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.heading{justify-content:space-between}.badge{font-size:10px;background:#ededfc;color:#6265d9;padding:4px 10px;border-radius:12px}.controls{margin:12px 0}.controls select{max-width:310px}.controls small{color:#758097;margin-left:auto}.stats{gap:18px;margin:9px 0 14px;color:#758097;font-size:11px}.stats b{font:600 15px ui-monospace,monospace;color:#6265d9;margin-right:5px}button,select{font:inherit;color:#48516c;background:#fff;border:1px solid #dde1ef;border-radius:7px;padding:5px 9px;cursor:pointer;transition:background .25s,color .25s,transform .15s}button:hover:not(:disabled){background:#f0f1fc;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #6265d9;outline-offset:2px}.primary{background:#6265d9;color:white}.primary:hover:not(:disabled){background:#5255c6}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:18px}.tokens{height:158px;overflow:auto;display:flex;flex-wrap:wrap;align-content:start;gap:6px;padding:10px;background:#f6f7fc;border:1px solid #e3e6f1;border-radius:10px}.token{font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#eeeffb;border-color:#dfe0f7;color:#5559b4;animation:enter .3s both}.token.special{color:#9d6b3c;background:#faf0e5;border-color:#eedfc9}.token.unknown{color:#7b8494;background:#f0f1f4;border-style:dashed}.token.active{background:#6265d9;color:white;border-color:#6265d9;box-shadow:0 2px 7px #6265d933}.token i{font:9px ui-monospace,monospace;font-style:normal;opacity:.6;margin-right:4px}.detail{min-height:88px;background:#f0f1fb;border-radius:9px;padding:11px 13px;margin-top:10px;overflow-wrap:anywhere}.detail strong{font-size:11px;color:#5357ac;display:block;margin-bottom:5px}.detail mark{background:#dcdfff;color:#383c8c;border-radius:3px}.detail small{display:block;color:#758097;font-size:10px;margin-top:5px}.analysis{height:256px;overflow:auto;border:1px solid #e1e5ef;border-radius:10px;padding:11px 13px}.analysis h3{margin:0 0 9px;font-size:12px;font-weight:600}.freq-row{display:grid;grid-template-columns:85px 1fr 30px;gap:8px;align-items:center;margin:9px 0;font-size:11px}.freq-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:6px;background:#edefF8;border-radius:4px}.track i{height:100%;display:block;background:#888be0;border-radius:4px;transform-origin:left;animation:grow .6s ease-out}.freq-row b{font:11px ui-monospace,monospace;text-align:right}table{border-collapse:collapse;width:100%;font-size:10px}td,th{text-align:right;padding:5px 4px;border-bottom:1px solid #e8ebf4}td:first-child,th:first-child{text-align:left;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}td button{border:0;background:transparent;padding:0;font-size:10px;color:#6265d9;max-width:100px;overflow:hidden;text-overflow:ellipsis}th{color:#758097;font-weight:400}.footer{font-size:10px;margin-top:10px;color:#758097}.status{height:3px;background:#eeeff8;border-radius:3px;overflow:hidden}.status i{display:block;height:100%;background:#8588e0;transition:width .3s}.empty{padding:70px 15px;text-align:center;color:#758097}.empty b{display:block;margin-bottom:10px;color:#6265d9}.pager{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px;color:#758097}.pager button{padding:3px 8px}.pager span{margin-left:auto}
@keyframes enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:750px){.layout{grid-template-columns:1fr}.controls small{margin-left:0}.analysis{height:220px}.stats{gap:10px}.heading{align-items:start}.controls select{max-width:100%}body{padding:15px}.tokens{height:170px}.token{max-width:110px}.analysis{height:255px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="heading"><h2>文字如何变成数字</h2><span class="badge" id="badge">真实分词</span></div>
<div class="controls"><select id="branch" aria-label="分词分支"></select><button class="primary" id="play">逐词回放</button><button id="reset">回到开头</button><small id="rule"></small></div>
<div class="stats" id="stats"></div>
<div class="layout"><section><div class="tokens" id="tokens" aria-label="真实词元序列"></div><div class="pager"><button id="prev" aria-label="上一页词元">←</button><button id="next" aria-label="下一页词元">→</button><span id="page"></span></div><div class="detail" id="detail"></div></section><section class="analysis" id="analysis"></section></div>
<div class="footer" id="footer"></div><div class="status" role="progressbar" aria-label="词元回放进度" aria-valuemin="0" aria-valuemax="100"><i id="progress"></i></div>
<script type="application/json" id="data">__TEXT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let branch=null,page=0,selected=0,timer=null;let pageSize=window.innerWidth<750?32:48;
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function stop(){clearInterval(timer);timer=null;$('play').textContent='逐词回放'}
function showDetail(){const t=branch.tokens[selected];if(!t)return;const box=$('detail');box.replaceChildren();box.append(node('strong',`${t.field} · 序号 ${t.index} · ${branch.kind==='neural'?'Token ID':'词表局部编号'} ${t.id===null?'未收录':t.id}`));if(t.special){box.append(node('span','模型加入的边界标记，不对应原文字段。'))}else{box.append(document.createTextNode((t.prefix_omitted?'…':'')+t.before),node('mark',t.surface||t.token),document.createTextNode(t.after+(t.suffix_omitted?'…':'')))}box.append(node('small',`原始词元 ${t.token}${t.end>t.start?` · 字符区间 [${t.start}, ${t.end})`:''}`));$('tokens').querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===selected));const percent=(selected+1)/branch.tokens.length*100;$('progress').style.width=percent+'%';$('progress').parentElement.setAttribute('aria-valuenow',percent.toFixed(1));}
function showPage(){const box=$('tokens');box.replaceChildren();branch.tokens.slice(page*pageSize,(page+1)*pageSize).forEach((t,j)=>{let index=page*pageSize+j;let b=node('button',undefined,'token'+(t.special?' special':'')+(t.known===false?' unknown':''));b.dataset.index=index;b.title=`${t.token} · ${t.id===null?'未收录':t.id}`;b.setAttribute('aria-label',`词元 ${t.index} ${t.surface||t.token}`);b.append(node('i',t.index),document.createTextNode(t.surface||t.token));b.onclick=()=>{stop();selected=index;showDetail()};box.append(b)});$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(branch.tokens.length/pageSize))} 页 · 展示 ${branch.tokens.length} / ${branch.total} 项`;$('prev').disabled=page===0;$('next').disabled=(page+1)*pageSize>=branch.tokens.length;showDetail();}
function analysis(){const box=$('analysis');box.replaceChildren();if(data.stats)box.append(node('p',`本邮件 · 正文 ${data.stats['正文字符']} 字 · ${data.stats['链接']} 个链接 · 数字 ${data.stats['数字占比']}`));box.append(node('h3',branch.kind==='neural'?'词元频次 · 前 10 项':'TF-IDF 向量值 · 前 12 项'));if(branch.features){const table=node('table');const header=node('tr');['词项','次数','IDF','向量值'].forEach(t=>header.append(node('th',t)));table.append(header);branch.features.forEach(f=>{const r=node('tr');const cell=node('td'),pick=node('button',f.term);pick.setAttribute('aria-label','查看特征 '+f.term);pick.title='查看 TF-IDF 计算';pick.onclick=()=>{stop();$('detail').replaceChildren(node('strong',`特征 ${f.term} · 出现 ${f.count} 次`),node('span',`TF = 1 + ln(${f.count}) = ${f.tf.toFixed(4)}；IDF = ${f.idf.toFixed(4)}`),node('small',`向量值 = TF × IDF ÷ ${f.norm.toFixed(4)} × ${f.block_weight} = ${f.tfidf.toFixed(6)}。分母是该区块全部命中项的 L2 范数。`))};cell.append(pick);r.append(cell);[f.count,f.idf.toFixed(2),f.tfidf.toFixed(4)].forEach(t=>r.append(node('td',t)));table.append(r)});box.append(table);box.append(node('p','向量值含 L2 归一化和区块权重；IDF 来自训练词表。'))}else{const max=Math.max(...branch.frequency.map(x=>x.count),1);branch.frequency.forEach(f=>{const r=node('div',undefined,'freq-row'),track=node('div',undefined,'track'),bar=node('i');bar.style.width=f.count/max*100+'%';track.append(bar);const label=node('span',f.term);label.title=f.term;r.append(label,track,node('b',f.count));box.append(r)})}}
function choose(){stop();branch=data.branches[Number($('branch').value)];page=0;selected=0;$('rule').textContent=branch.algorithm;$('badge').textContent=branch.verified?'已与本次模型输入逐项核对':branch.kind==='neural'?'同一推理流程 · 预览':'已保存词表 · 实际转换';$('stats').replaceChildren();const values=branch.kind==='neural'?{'原始词元':branch.original,'实际保留':branch.total,'截去':branch.omitted,'不同词元':branch.unique}:{'分词 / 片段':branch.total,'不同项':branch.unique,'激活特征':branch.active};Object.entries(values).forEach(([label,value])=>{let item=node('span');item.append(node('b',value),document.createTextNode(label));$('stats').append(item)});$('footer').textContent=branch.rule+'。定位基于清洗后的输入，词元可能是单字或子词。颜色表示边界 / 收录状态；动画回放已完成的分词。';if(branch.total>branch.tokens.length)$('footer').textContent+=' 仅列前 400 项，统计覆盖全文。';if(!branch.tokens.length){$('tokens').replaceChildren(node('p','当前区块无可提取词项'));$('detail').textContent='激活特征为 0';$('play').disabled=true;$('prev').disabled=true;$('next').disabled=true}else{$('play').disabled=false;showPage()}analysis();}
data.branches.forEach((b,i)=>{const option=node('option',b.name);option.value=i;$('branch').append(option)});$('branch').onchange=choose;
$('prev').onclick=()=>{stop();page--;selected=page*pageSize;showPage()};$('next').onclick=()=>{stop();page++;selected=page*pageSize;showPage()};$('reset').onclick=()=>{stop();page=0;selected=0;showPage()};$('play').onclick=()=>{if(timer){stop();return}if(selected===branch.tokens.length-1){selected=0;page=0;showPage()}$('play').textContent='暂停';timer=setInterval(()=>{selected++;if(selected>=branch.tokens.length){selected=branch.tokens.length-1;stop();return}const nextPage=Math.floor(selected/pageSize);if(page!==nextPage){page=nextPage;showPage()}else showDetail();if(selected===branch.tokens.length-1)stop()},420)};window.addEventListener('pagehide',stop);window.addEventListener('resize',()=>{const size=window.innerWidth<750?32:48;if(size!==pageSize&&branch){pageSize=size;page=Math.floor(selected/pageSize);showPage()}});
if(data.branches.length)choose();else{document.querySelectorAll('button,select').forEach(n=>n.disabled=true);$('tokens').className='empty';$('tokens').append(node('b',data.state),node('p','选择邮件后显示真实分词、词频和数字特征。'));$('badge').textContent='等待文本'}
</script></html>
